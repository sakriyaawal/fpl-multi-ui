<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPL Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header>
    <h1>Fantasy Premier League Dashboard</h1>
    <p>Live League Standings & Manager Analytics</p>
  </header>

  <!-- Navigation Bar -->
  <nav>
    <div class="nav-container">
      <button class="nav-btn active" data-view="standings">Standings</button>
      <button class="nav-btn" data-view="managers">Manager Search</button>
      <button class="nav-btn" data-view="stats">Stats</button>
    </div>
  </nav>

  <!-- Main Content -->
  <main>
    <!-- League Standings View -->
    <section id="standings" class="view active">
      <div class="view-header">
        <h2>League Standings</h2>
        <div class="controls">
          <select id="league-select">
            <option value="">Select a League...</option>
          </select>
          <span class="badge" id="gameweek-badge">GW --</span>
        </div>
      </div>

      <div id="standings-loader" class="loader">Select a league to view standings</div>

      <div class="table-responsive" id="standings-table-container" style="display: none;">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-sort="rank">Rank <span class="sort-icon"></span></th>
              <th class="sortable" data-sort="player_name">Manager <span class="sort-icon"></span></th>
              <th class="sortable" data-sort="entry_name">Team <span class="sort-icon"></span></th>
              <th class="sortable" data-sort="event_total">GW Pts <span class="sort-icon"></span></th>
              <th class="sortable" data-sort="total">Total Pts <span class="sort-icon"></span></th>
            </tr>
          </thead>
          <tbody id="standings-tbody">
            <!-- Dynamic rows inserted via JavaScript -->
          </tbody>
        </table>

        <!-- Pagination Controls -->
        <div class="pagination-container" id="pagination-container">
          <span class="pagination-info" id="pagination-info">Showing 0-0 of 0</span>
          <div class="pagination-buttons" id="pagination-buttons">
            <!-- Dynamic page buttons inserted via JavaScript -->
          </div>
        </div>
      </div>
    </section>

    <!-- Manager Search View -->
    <section id="managers" class="view">
      <div class="view-header">
        <h2>Manager Search</h2>
      </div>
      <p>Search feature coming soon...</p>
    </section>

    <!-- Stats View -->
    <section id="stats" class="view">
      <div class="view-header">
        <h2>General Stats</h2>
      </div>
      <p>Analytics coming soon...</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
